name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger on push to main branch
      - develop
  pull_request:
    branches:
      - main  # Trigger on pull requests to main branch
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Specify the Node.js version that matches your project

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build  # Ensure you have a build script in your package.json

      - name: Run tests
        run: npm test  # If you have tests, otherwise remove this step

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Wait for the build job to complete
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to Vercel  # Example for Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}  # Store your Vercel token in GitHub secrets
          vercel-organization: <your-vercel-org>  # Optional: specify your Vercel organization
          vercel-project: <your-vercel-project>  # Specify your Vercel project name
          github-token: ${{ secrets.GITHUB_TOKEN }}  # Required for Vercel to access GitHub

      # Alternatively, if using Netlify or another service, add deployment steps accordingly

